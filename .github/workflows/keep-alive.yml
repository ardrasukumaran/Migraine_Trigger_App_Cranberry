name: Keep Cranberry Server Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch:        # manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping cranberry-notifications
        run: |
          curl -f https://cranberry-notifications.onrender.com/health
          echo "Server is alive!"
